<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
            >
            <button type="submit">Add</button>
        </form>

        <p id="task-count">0 tasks remaining</p>
        <ul id="task-list"></ul>

        <button id="clear-completed" class="clear-btn">
            Clear Completed
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
